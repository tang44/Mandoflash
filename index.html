<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">


<title>MANDOFLASH by Tang0</title>


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="games.css">


</head>


<body>


<h1>MANDOFLASH by Tang0</h1>




<!-- =====================================================
     CONTROL PANEL
===================================================== -->


<div class="control-panel">



    <div class="control-section">


        <h3>

            Database Filters

            <span id="cardCount">
                (0 cards)
            </span>

        </h3>



        <div class="controls">



            <input
                id="search"
                placeholder="Search..."
            >




            <select id="levelFilter">

                <option value="">
                    All Levels
                </option>

            </select>





            <select id="posFilter">

                <option value="">
                    All Parts of Speech
                </option>

            </select>





            <select id="sort">


                <option value="">
                    Sort
                </option>


                <option value="number">
                    Number
                </option>


                <option value="Hanzi">
                    Hanzi
                </option>


                <option value="pinyin">
                    Pinyin
                </option>


                <option value="english">
                    English
                </option>


                <option value="random">
                    Random
                </option>


            </select>



        </div>


    </div>





    <div class="control-section">


        <h3>
            Study Mode
        </h3>




        <div class="controls">


            <select id="mode">


                <option value="flash">
                    Flashcards
                </option>

                <option value="reading">
                    Reading
                </option>


                <option value="quiz">
                    Quiz
                </option>


                <option value="games">
                    Mini Games
                </option>



            </select>


        </div>


    </div>



</div>







<!-- =====================================================
     FLASHCARD
===================================================== -->


<div id="card"
     class="card flash-card">


    <div id="front"
         class="front">
    </div>



    <div id="back"
         class="back hidden">
    </div>


</div>







<!-- =====================================================
     QUIZ LAYOUT
===================================================== -->


<div id="quizLayout">



    <div id="quiz"
        class="card quiz-card hidden">



        <h2 id="question"></h2>



        <div id="answers">
        </div>



        <button id="nextQuestion">

            Next Question

        </button>



    </div>





    <div id="quizControls"
         class="quizSettings hidden">



        <h3>
            <br>
            
            Quiz Settings
            
        </h3>




        <select id="quizDirection">


            <option value="HanziToEnglish">

                Hanzi → English

            </option>



            <option value="englishToHanzi">

                English → Hanzi

            </option>



        </select>





        <select id="quizLength">


            <option value="10">
                10 Questions
            </option>


            <option value="20">
                20 Questions
            </option>


            <option value="50">
                50 Questions
            </option>


            <option value="all">
                All Questions
            </option>



        </select>


        <h3>
            <br>
            <hr>
            <br>
            Quiz Status
            
        </h3>



        <div class="quizStatus">


            <div id="questionCounter">
            </div>


            <div id="scoreDisplay">

                Score: 0/0

            </div>


        </div>



        <button id="resetQuiz">

            Reset Quiz

        </button>
        <br>



    </div>



</div>

<!-- =====================================================
     GAME LAYOUT
===================================================== -->


<div id="gameLayout">





    <!-- ==========================
         GAME DISPLAY
    =========================== -->


    <div id="gameArea"
        class="card game-card hidden">





        <h2 id="gameTitle">

            Mini Game

        </h2>





        <div id="gamePrompt"
             class="quizPrompt">

        </div>





        <div id="gameAnswers">

        </div>







        <!-- TYPING GAME -->


        <div id="typingArea"
             class="hidden">


            <input
                id="typingInput"
                placeholder="Type your answer..."
                autocomplete="off"
            >



            <button id="submitTyping">

                Submit

            </button>



        </div>







        <!-- BOSS GAME -->


        <div id="bossArea"
             class="hidden">


            <h2>

                🐉 Boss

            </h2>




            <progress
                id="bossHealth"
                value="100"
                max="100">
            </progress>





            <div id="bossHP">

                100 / 100 HP

            </div>




        </div>





    </div>








    <!-- ==========================
         GAME STATUS PANEL
    =========================== -->


    <div id="gameControls"
         class="quizSettings hidden">





        <h3>

            Mini Games

        </h3>





        <select id="gameMode">



            <option value="speed">

                ⚡ Speed Round

            </option>




            <option value="survival">

                ❤️ Survival

            </option>


            <option value="boss">

                🐉 Boss Battle

            </option>

            <option value="streak">

                🔥 Streak Challenge

            </option>




            <option value="typing">

                ⌨️ Typing Practice

            </option>




            




        </select>

        <div id="gameDescription"
     class="game-description">

    ⚡ Answer as many questions as possible before time runs out.

</div>







        <hr>







        <h3>

            Game Status

        </h3>







        <div class="quizStatus">





            <!-- ALWAYS DISPLAYED -->


            <div id="gameStatus">

                Ready

            </div>





            <div id="gameScore">

                Score: 0

            </div>







            <!-- SPEED ONLY -->


            <div id="gameTimer"
                 class="hidden">

                ⏱ --

            </div>







            <!-- SURVIVAL ONLY -->


            <div id="gameLives"
                 class="hidden">

                ❤️❤️❤️

            </div>








            <!-- STREAK / TYPING ONLY -->


            <div id="gameCombo"
                 class="hidden">

                🔥 0

            </div>






        </div>







        <button id="startGame">

            Start Game

        </button>





    </div>





</div>

<!-- =====================================================
     FLASHCARD BUTTONS
===================================================== -->


<div id="flashButtons"
     class="buttons">



    <button id="prev">

        Previous

    </button>





    <button id="flip">

        Flip

    </button>





    <button id="random">

        Random

    </button>





    <button id="next">

        Next

    </button>





    <div id="counter">

    </div>



</div>







<!-- =====================================================
     JAVASCRIPT
===================================================== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script src="data.js"></script>

<script src="apps.js"></script>

<script src="quiz.js"></script>

<script src="games.js"></script>





</body>

</html>
